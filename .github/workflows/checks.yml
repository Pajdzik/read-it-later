name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Test extension change detection
        id: extension_changes
        run: |
          node --test scripts/ci-extension-changes.test.mjs
          node scripts/ci-extension-changes.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript across all runtimes
        run: |
          pnpm check
          pnpm typecheck:fetcher

      - name: Run Worker and D1 tests
        run: pnpm test

      - name: Test native capture executor
        run: pnpm test:capture

      - name: Check Container build engine
        run: docker info

      - name: Build capture image and private Worker (dry run)
        run: pnpm check:capture

      - name: Build for deployment (dry run)
        run: pnpm build

      - name: Package the safe fetch probe (dry run)
        run: pnpm build:fetch-probe

      - name: Test pinned safe fetch and gateway protocol
        run: pnpm test:fetcher

      - name: Package the safe fetch gateway Worker (dry run)
        run: pnpm build:fetcher-dry-run

      - name: Run browser extension checks
        if: steps.extension_changes.outputs.run == 'true'
        run: pnpm test:extension

      - name: Run mobile browser smoke test
        run: pnpm test:mobile

      - name: Rehearse archive restoration
        run: pnpm test:archive

      - name: Test Obsidian conversion and local restore
        run: pnpm test:obsidian

      - name: Test GitHub Markdown recovery and local restore
        run: pnpm test:github

  browser-checks:
    name: Browser checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        playwright-version: [1.62.1]
    # The image contains the browser binaries and OS libraries for this exact
    # Playwright release, so CI never runs apt-based `install --with-deps`.
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright-version }}-noble
      options: --ipc=host --init
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Detect extension changes
        id: extension_changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/ci-extension-changes.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright image version matches the project
        env:
          EXPECTED_PLAYWRIGHT_VERSION: ${{ matrix.playwright-version }}
        run: |
          node -e 'const actual = require("./package.json").devDependencies.playwright; if (actual !== process.env.EXPECTED_PLAYWRIGHT_VERSION) { console.error(`Playwright image is ${process.env.EXPECTED_PLAYWRIGHT_VERSION}, package.json requires ${actual}`); process.exit(1); }'

      - name: Run prototype smoke test
        run: pnpm test:prototype

      - name: Run browser smoke test
        run: pnpm test:browser

      - name: Run browser extension checks
        if: steps.extension_changes.outputs.run == 'true'
        run: pnpm test:extension

      - name: Run mobile browser smoke test
        run: pnpm test:mobile

      - name: Rehearse archive restoration
        run: pnpm test:archive

  verify-result:
    name: Verify
    if: always()
    needs: [verify, browser-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        run: test "${{ needs.verify.result }}" = success && test "${{ needs.browser-checks.result }}" = success

  deploy-production:
    name: Deploy production
    needs: verify-result
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN Actions secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID Actions secret."; exit 1; }

      - name: Check Container build engine
        run: docker info

      # The app's ARTICLE_EXTRACTOR service binding must exist before app deployment.
      # Wrangler builds and pushes the image using the runner's Docker engine.
      - name: Deploy production capture service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: pnpm exec wrangler deploy --config capture/wrangler.jsonc --env production

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: pnpm exec wrangler d1 migrations apply read-later-production --remote --env production

      - name: Build website assets
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: |
          export BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pnpm build:web

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: pnpm exec wrangler deploy --env production
