name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests own feature-branch verification; pushes are limited to main
  # so production deployment remains available without duplicate runs.
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Detect capture build changes
        id: capture_changes
        run: node scripts/ci-capture-changes.mjs

      - name: Test CI change detection and cached Docker routing
        run: node --test scripts/ci-*.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript across all runtimes
        run: |
          pnpm check

      - name: Run Worker and D1 tests
        run: pnpm test

      - name: Test enrichment evaluation and recorded evidence (offline)
        run: pnpm test:enrichment-evaluator

      - name: Test queue provisioning
        run: pnpm test:queues-deployment

      - name: Test native capture executor
        run: pnpm test:capture

      - name: Build capture image and private Worker (dry run, cached)
        if: steps.capture_changes.outputs.run == 'true'
        uses: ./.github/actions/capture-build

      - name: Build for deployment (dry run)
        run: pnpm build

      - name: Test Obsidian conversion and local restore
        run: pnpm test:obsidian

      - name: Test GitHub Markdown recovery and local restore
        run: pnpm test:github

  browser-checks:
    name: Browser checks (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright-version: [1.62.1]
        suite: [desktop, mobile, extension]
    # The image contains the browser binaries and OS libraries for this exact
    # Playwright release, so CI never runs apt-based `install --with-deps`.
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright-version }}-noble
      options: --ipc=host --init
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Detect extension changes
        if: matrix.suite == 'extension'
        id: extension_changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/ci-extension-changes.mjs

      - name: Install dependencies
        if: matrix.suite != 'extension' || steps.extension_changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check Playwright image version matches the project
        env:
          EXPECTED_PLAYWRIGHT_VERSION: ${{ matrix.playwright-version }}
        run: |
          node <<'NODE'
          const actual = require("./package.json").devDependencies.playwright;
          if (actual !== process.env.EXPECTED_PLAYWRIGHT_VERSION) {
            console.error(`Playwright image is ${process.env.EXPECTED_PLAYWRIGHT_VERSION}, package.json requires ${actual}`);
            process.exit(1);
          }
          NODE

      - name: Run browser smoke test
        if: matrix.suite == 'desktop'
        run: pnpm test:browser

      - name: Run browser extension checks
        if: matrix.suite == 'extension' && steps.extension_changes.outputs.run == 'true'
        run: pnpm test:extension

      - name: Run mobile browser smoke test
        if: matrix.suite == 'mobile'
        run: pnpm test:mobile

      - name: Verify explicit podcast preparation and private feed controls
        if: matrix.suite == 'desktop'
        run: pnpm test:podcast-ui

      - name: Rehearse archive restoration
        if: matrix.suite == 'mobile'
        run: pnpm test:archive

  verify-result:
    name: Verify
    if: always()
    needs: [verify, browser-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        run: test "${{ needs.verify.result }}" = success && test "${{ needs.browser-checks.result }}" = success

  deploy-production:
    name: Deploy production
    needs: verify-result
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN Actions secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID Actions secret."; exit 1; }

      - name: Verify fresh production D1 configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8')).env.production.d1_databases.find((db) => db.binding === 'DB');
          const capture = JSON.parse(fs.readFileSync('capture/wrangler.jsonc', 'utf8')).env.production.d1_databases.find((db) => db.binding === 'DB');
          const oldId = 'e4a7e714-8e4e-413d-8f13-51c0c02fab5f';
          const validId = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if (!app || !capture || app.database_name !== 'read-later-production-v1' || capture.database_name !== 'read-later-production-v1' || app.database_id !== capture.database_id || !validId.test(app.database_id) || app.database_id === oldId) {
            console.error('Production D1 is not configured for the fresh database. Follow docs/prelaunch-reset.md, create the new database, and set the same new UUID in both Wrangler configs.');
            process.exit(1);
          }
          NODE

      - name: Check Container build engine
        run: docker info

      - name: Ensure private PDF storage exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: |
          if ! pnpm exec wrangler r2 bucket info read-it-later-pdfs-production --env production; then
            pnpm exec wrangler r2 bucket create read-it-later-pdfs-production --env production --update-config=false
          fi
          if ! pnpm exec wrangler r2 bucket info read-it-later-audio-production --env production; then
            pnpm exec wrangler r2 bucket create read-it-later-audio-production --env production --update-config=false
          fi

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: pnpm exec wrangler d1 migrations apply read-later-production-v1 --remote --env production

      # The app's ARTICLE_EXTRACTOR service binding must exist before app deployment.
      # Wrangler builds and pushes the image using the runner's Docker engine.
      - name: Deploy production capture service (cached)
        uses: ./.github/actions/capture-build
        with:
          environment: production
          dry-run: 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"

      - name: Build website assets
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: |
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_TIMESTAMP
          pnpm build:web

      - name: Ensure production extraction queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: |
          pnpm queue:ensure --env production --execute
          pnpm audio:queue:ensure --env production --execute

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: pnpm exec wrangler deploy --env production
