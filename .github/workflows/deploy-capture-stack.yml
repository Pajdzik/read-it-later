name: Deploy capture stack (paused)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Application and gateway environment to deploy (capture stays paused)
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true
      app_origin:
        description: Exact HTTPS origin configured for the selected app environment
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.environment }}-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CAPTURE_ENVIRONMENT: ${{ inputs.environment }}
      CAPTURE_APP_ORIGIN: ${{ inputs.app_origin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate target, config, and credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the selected GitHub environment's Cloudflare API token."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in the selected GitHub environment."; exit 1; }
          pnpm exec tsx scripts/deploy-capture-stack.ts --dry-run

      - name: Typecheck and test the gateway and deployment plan
        run: |
          pnpm typecheck
          pnpm typecheck:fetcher
          pnpm test:fetcher
          pnpm test:capture-deployment

      - name: Build assets, migrate D1, deploy gateway, then deploy app
        run: pnpm exec tsx scripts/deploy-capture-stack.ts --execute
